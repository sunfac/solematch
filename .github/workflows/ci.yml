name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard — affiliate env reads must be static (Metro inlining)
        run: |
          if grep -nE 'process\.env[[:space:]]*\[' src/lib/affiliate.ts; then
            echo "::error::affiliate.ts uses dynamic process.env[...] — Metro will not inline it into the web bundle, which silently disables affiliate wrapping. Use static process.env.EXPO_PUBLIC_X instead."
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npx jest --ci --silent
      - run: npx expo export --platform web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
